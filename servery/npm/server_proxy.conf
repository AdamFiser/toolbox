# Vkládá se do každého proxy hostu NPM (include /data/nginx/custom/server_proxy[.]conf).
#
# Stránka o údržbě pro chyby, které vygeneruje sám nginx: kontejner aplikace
# neběží nebo se restartuje (502), neodpovídá (504). Chybové stránky aplikací
# se nenahrazují. proxy_intercept_errors zůstává off, takže 5xx z aplikace
# projde beze změny.
error_page 502 503 504 =503 /__npm_maintenance.html;

location = /__npm_maintenance.html {
	root /data/custom_pages;
	internal;
	add_header Retry-After 20 always;
	add_header Cache-Control "no-store" always;
}

<!DOCTYPE html>
<!-- Stránka o údržbě pro NPM (502/503/504 z proxy). Layout převzatý z Trenisu: app/Modules/Presenters/templates/Error/500.phtml + @errorBlock.phtml. Generuje servery/npm/render-maintenance.php. -->
<html lang="cs">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<meta http-equiv="refresh" content="20">
	<title>Probíhá aktualizace</title>
		<style>
		/* Soběstačná kopie bloku .ds-err z trenis.ds.css (viz komentář výš) —
		   doslovné hex hodnoty místo --ds-* proměnných, protože tokeny se
		   sem samy o sobě nenačtou (žádný <link>). Hodnoty ověřené proti
		   trenis.ds-tokens.css k datu vzniku (2026-09-06). */
		:root {
			color-scheme: light dark;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
			background: #F9FAFB;
			color: #101828;
		}

		.ds-err-host {
			container-type: inline-size;
			width: 100%;
			max-width: 860px;
		}

		.ds-err {
			display: grid;
			grid-template-columns: 76px 1fr;
			background: #FFFFFF;
			border: 1px solid #E4E7EC;
			border-radius: 16px;
			box-shadow: 0 1px 2px 0 rgba(16, 24, 40, .05);
			overflow: hidden;
		}

		.ds-err__brand {
			position: relative;
			grid-column: 1;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			gap: 8px;
			padding: 16px 8px;
			overflow: hidden;
			background: linear-gradient(170deg, #3641F5 0%, #465FFF 55%, #2A31D8 100%);
			color: #FFFFFF;
		}

		.ds-err__brandart {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			opacity: .3;
		}

		.ds-err__brand-top {
			display: none;
			align-items: center;
			gap: 8px;
			position: relative;
			z-index: 1;
		}

		.ds-err__brand-name {
			font-weight: 700;
		}

		.ds-err__brand-subtitle {
			display: none;
			position: relative;
			z-index: 1;
			font-size: 12px;
			opacity: .85;
		}

		.ds-err__brand-code {
			position: relative;
			z-index: 1;
			display: block;
			font-size: 32px;
			font-weight: 800;
			line-height: 1;
			font-variant-numeric: tabular-nums;
			text-align: center;
		}

		.ds-err__hero {
			display: none;
			grid-column: 2;
			align-items: center;
			overflow: hidden;
		}

		.ds-err__hero svg {
			width: 100%;
			height: 100%;
		}

		.ds-err__hero-code {
			font-size: 72px;
			font-weight: 800;
			fill: none;
			stroke: #465FFF;
			stroke-width: 1.5;
			opacity: .5;
		}

		.ds-err__body {
			grid-column: 2;
			min-width: 0;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.ds-err__lede {
			display: flex;
			align-items: flex-start;
			gap: 12px;
		}

		.ds-err__icon {
			flex-shrink: 0;
			margin-top: 2px;
			color: #D92D20;
		}

		.ds-err__code {
			display: block;
			margin-bottom: 2px;
			font-size: 12px;
			font-weight: 600;
			color: #98A2B3;
		}

		.ds-err__title {
			margin: 0 0 4px;
			font-size: 14px;
			font-weight: 600;
			line-height: 1.3;
			color: #101828;
		}

		.ds-err__text {
			margin: 0 0 4px;
			font-size: 14px;
			line-height: 20px;
			color: #344054;
		}

		.ds-err__hint {
			display: inline-flex;
			align-items: flex-start;
			gap: 6px;
			font-size: 12px;
			color: #98A2B3;
		}

		.ds-err__hint svg {
			flex-shrink: 0;
			margin-top: 1px;
		}

		.ds-err__diag {
			display: none;
		}

		.ds-err__diag-label {
			display: block;
			margin-bottom: 2px;
			font-size: 12px;
			color: #98A2B3;
		}

		.ds-err__diag-value {
			font-size: 14px;
			color: #101828;
			font-variant-numeric: tabular-nums;
		}

		.ds-err__meta {
			display: flex;
			flex-wrap: wrap;
			gap: 4px 12px;
			font-size: 12px;
			color: #98A2B3;
			font-variant-numeric: tabular-nums;
		}

		.ds-err__actions {
			display: flex;
		}

		.ds-err__actions--wide {
			display: none;
			flex-wrap: wrap;
			min-width: 0;
			gap: 8px;
		}

		.ds-err .btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border: 1px solid transparent;
			border-radius: 8px;
			text-decoration: none;
			font-weight: 600;
			white-space: nowrap;
			cursor: pointer;
		}

		.ds-err .btn-primary {
			background: #465FFF;
			color: #FFFFFF;
		}

		.ds-err .btn-default {
			background: #FFFFFF;
			border-color: #E4E7EC;
			color: #344054;
		}

		.ds-err .btn-outline-secondary {
			background: transparent;
			border-color: #E4E7EC;
			color: #344054;
		}

		.ds-err__action {
			height: 26px;
			padding: 0 10px;
			font-size: 12px;
			line-height: 26px;
		}

		.ds-copyable__btn {
			display: none;
		}

		@container (min-width: 440px) {
			.ds-err {
				grid-template-rows: 120px auto;
			}

			.ds-err__brand {
				grid-row: 1 / span 2;
			}

			.ds-err__hero {
				display: flex;
				grid-row: 1;
			}

			.ds-err__body {
				grid-row: 2;
			}

			.ds-err__title {
				font-size: 26px;
			}

			.ds-err__diag {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 4px 16px;
			}

			.ds-err__meta {
				display: none;
			}

			.ds-err__action {
				height: 32px;
				padding: 0 14px;
				font-size: 14px;
				line-height: 32px;
			}
		}

		@container (min-width: 760px) {
			.ds-err {
				grid-template-columns: 300px 1fr;
				grid-template-rows: auto;
			}

			.ds-err__brand {
				grid-row: 1;
				justify-content: center;
				align-items: center;
				padding: 32px 24px;
				gap: 16px;
			}

			.ds-err__brand-top {
				display: flex;
			}

			.ds-err__brand-subtitle {
				display: block;
			}

			.ds-err__brand-code {
				font-size: 72px;
			}

			.ds-err__hero {
				display: none;
			}

			.ds-err__body {
				grid-row: 1;
				justify-content: center;
				padding: 32px;
			}

			.ds-err__actions {
				display: none;
			}

			.ds-err__actions--wide {
				display: flex;
				gap: 8px;
			}

			.ds-err__actions--wide .btn {
				height: 36px;
				padding: 0 16px;
				font-size: 14px;
			}
		}

		@media (prefers-color-scheme: dark) {
			body {
				background: #0C111D;
				color: rgba(255, 255, 255, .95);
			}

			.ds-err {
				background: #1A2231;
				border-color: #344054;
			}

			.ds-err__code,
			.ds-err__hint,
			.ds-err__meta {
				color: #667085;
			}

			.ds-err__title {
				color: rgba(255, 255, 255, .95);
			}

			.ds-err__text {
				color: #D0D5DD;
			}

			.ds-err__diag-label {
				color: #667085;
			}

			.ds-err__diag-value {
				color: rgba(255, 255, 255, .95);
			}

			.ds-err .btn-default,
			.ds-err .btn-outline-secondary {
				background: transparent;
				border-color: #344054;
				color: #D0D5DD;
			}
		}
	</style>
</head>
<body>
<div class="ds-err-host">
	<div class="ds-err ds-err--play">
		<div class="ds-err__brand">
			<svg class="ds-err__brandart" viewBox="0 0 300 620" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
				<circle cx="36" cy="90" r="72" fill="none" stroke="#fff" stroke-width="1"/>
				<circle cx="270" cy="230" r="118" fill="none" stroke="#fff" stroke-width="1"/>
				<line x1="-10" y1="360" x2="310" y2="300" stroke="#fff" stroke-width="1"/>
				<line x1="-10" y1="430" x2="310" y2="480" stroke="#fff" stroke-width="1"/>
				<line x1="60" y1="600" x2="60" y2="0" stroke="#fff" stroke-width="1"/>
			</svg>
			<div class="ds-err__brand-top">
				<span class="ds-err__brand-logo" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
						<rect x="3" y="3" width="18" height="18" rx="4"/>
						<path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/>
					</svg>
				</span>
				<span class="ds-err__brand-name">PKP CARGO INTERNATIONAL</span>
			</div>
			<div class="ds-err__brand-body">
				<span class="ds-err__brand-subtitle">Odstavená souprava</span>
				<span class="ds-err__brand-code">503</span>
			</div>
		</div>
		<div class="ds-err__hero" aria-hidden="true">
			<svg viewBox="0 0 220 100" preserveAspectRatio="xMidYMid meet">
				<text x="4" y="82" class="ds-err__hero-code">503</text>
			</svg>
		</div>
		<div class="ds-err__body">
			<div class="ds-err__lede">
				<svg class="ds-err__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
					<path d="M12 3 2 20h20L12 3Z" stroke-linejoin="round"/>
					<path d="M12 10v4" stroke-linecap="round"/>
					<circle cx="12" cy="17" r=".5" fill="currentColor" stroke="none"/>
				</svg>
				<div>
					<span class="ds-err__code">HTTP 503</span>
										<h1 class="ds-err__title">Probíhá aktualizace</h1>
										<p class="ds-err__text">Nasazujeme novou verzi aplikace. Za chvilku jsme zpátky. Stránka se sama obnoví za 20 sekund.</p>
										<span class="ds-err__hint">
						<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
							<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z" stroke-linejoin="round" stroke-linecap="round"/>
						</svg>
						Nemusíte nic dělat. Když se stránka neobnoví sama, klikněte na Zkusit znovu.					</span>
									</div>
			</div>
									<div class="ds-err__actions">
								<a class="btn btn-primary ds-err__action" href="">Zkusit znovu</a>
			</div>
			<div class="ds-err__actions--wide">
								<a class="btn btn-primary" href="">Zkusit znovu</a>
							</div>
					</div>
	</div>
</div>
</body>
</html>
